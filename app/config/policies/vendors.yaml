# =============================================================================
# Official source policy
#
# Maps a detected technology/vendor onto the set of domains that count as
# authoritative for it. The agent may PROPOSE a vendor key; it can never
# propose a domain. Domains come only from this file.
#
# domain_mode:
#   strict -> hard-restrict search to `official_domains` (Tavily include_domains_mode=filter)
#   prefer -> strongly boost official domains, allow others (Tavily ...=boost)
# =============================================================================

version: 1

defaults:
  domain_mode: strict
  # Applied when no vendor matches and the question still needs external evidence.
  fallback_domain_mode: prefer
  fallback_domains: []

# Authority tiers drive result ranking. Lower number = more authoritative.
# Every retrieved web result is assigned a tier; the agent is shown the tier and
# synthesis prefers lower-tier evidence when sources disagree.
authority_tiers:
  1:
    name: official_documentation
    description: First-party product/user documentation published by the vendor.
  2:
    name: official_api_reference
    description: First-party API/SDK reference material.
  3:
    name: official_repository
    description: Vendor-owned source repositories, changelogs and release notes.
  4:
    name: authoritative_secondary
    description: Standards bodies, peer-reviewed or otherwise vetted publishers.
  5:
    name: community
    description: Blogs, forums, Q&A. Used only when nothing better exists.

# Domains that are never acceptable as a citation for a technical claim.
# Content-farm and AI-scraped mirror sites.
blocked_domains:
  - w3schools.com
  - geeksforgeeks.org
  - tutorialspoint.com
  - javatpoint.com

# Non-vendor domains that are still reasonably authoritative (tier 4).
authoritative_secondary_domains:
  - ietf.org
  - rfc-editor.org
  - w3.org
  - iso.org
  - nist.gov
  - owasp.org
  - python.org
  - postgresql.org

vendors:
  microsoft_azure:
    display_name: Microsoft Azure
    # Matching is deterministic keyword/alias matching over the question text;
    # the LLM's own vendor guess is treated as one more signal, not as truth.
    aliases:
