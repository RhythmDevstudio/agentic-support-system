      - techcommunity.microsoft.com
    domain_tiers:
      learn.microsoft.com: 1
      azure.microsoft.com: 2
      devblogs.microsoft.com: 3
      techcommunity.microsoft.com: 4
    repositories:
      - github.com/Azure
      - github.com/microsoft
    domain_mode: strict

