[project]
name = "agentic-support-system"
version = "0.1.0"
description = "Agentic AI Support & Knowledge Research System - grounded documentation research with verified citations, and support ticket triage with deterministic routing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Agent runtime
    "langgraph>=1.2,<2",
    "langchain-core>=1.0,<2",
    # LLM provider
    "openai>=2.0",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Config / policy
    "pyyaml>=6.0",
    # Ingestion
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    # Retrieval math (offline vector store)
    "numpy>=1.26",
    # Infra
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Real web research provider. Without this the FixtureSearchProvider is used.
web = [
    "tavily-python>=0.5",
]
# Production vector store + durable LangGraph checkpointer.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: exercises multiple layers end to end",
    "evaluation: scored evaluation cases, not pass/fail correctness tests",
    "requires_openai: needs a live OPENAI_API_KEY",
    "requires_postgres: needs a live PostgreSQL + pgvector instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# "._*" excludes macOS AppleDouble sidecar files, which the project's external
# drive generates and which are not valid UTF-8.
exclude = [".venv", "data", "._*", "**/._*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class attrs without ClassVar - noisy with pydantic
    "SIM905", # multi-line """...""".split() word lists are more readable than list literals
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["^\\.venv/", "^tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
